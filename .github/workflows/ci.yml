name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate clinical cases
        run: npm run validate:cases

      - name: Validate exam coverage
        run: npm run validate:coverage

      - name: Validate liveries and twilight
        run: npm run validate:themes

      - name: Validate 3D showroom model
        run: npm run validate:spatial

      - name: Validate editable navigation
        run: npm run validate:nav

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # next build only: e2e runs without a database, so no migrations.
      - name: Build
        run: npx next build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
